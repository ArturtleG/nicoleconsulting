        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="Nicole McRee Educational Consulting">

        <title>Admin Login</title>

        <link rel="canonical" href="https://mcree-ed.consulting/">
        <link rel="icon" type="image/x-icon" href="images/Initials.svg">
        <link rel="stylesheet" href="css/root.css?v=100" data-version/>
        <link rel="stylesheet" href="css/scroll.css?v=100" data-version/>
        <link rel="stylesheet" href="css/main.css?v=122" data-version/>
        <link rel="stylesheet" href="css/newsletter.css?v=2" data-version/>

        <link rel="stylesheet" href="css/trix.css" data-version>
        <link rel="stylesheet" href="css/blog.css?v=118" data-version/>

        <link rel="preload" as="image" href="images/portraitCircle.png">-->

        <script src="js/jquery-3.7.1.min.js"></script>
    </head>
    
    <body class="dots">
        <div id="login_wrapper">
            <h1>Admin Login</h1>
            <button id="login_button" class="primary-button">Sign in with Google</button>
        </div>

        <header id="top_menu">
            <div class="logo">
                <div class="hero-header-wrapper">
                    <img class="hero-header" src="images/portraitCircle.png" alt="Portrait of Nicole McCree" loading="eager"/>
                </div>
                <a href="index.html"><img src="images/nicoleSignatureWhiteF.svg" alt="Nicole McCree signature logo" loading="eager"/></a>
            </div>
            <div>
                <button id="display_posts_button" class="primary-button">Blogs</button>
                <button id="display_newsletter_button" class="primary-button">Newsletters</button>
            </div>
        </header>
        <div id="blogs_wrapper" style="display: none;">
            <section id="previous_posts_wrapper">            
                <button id="clear_filter" class="primary-button"></button>
                <div id="previous_posts"></div>
                <div class="bottom_right_button_wrapper">
                    <button id="new_post_button" class="primary-button square_button new_button"></button>
                </div>
            </section>
            <div id="modal_post_form" class="modal hidden">
                <div id="form_wrapper">
                    <div id="form_heading">New Post</div>
                    <form id="post_form">
                        <div id="form_scroll_wrapper">
                            <div id="form_info">
                                <label>
                                    <h5 class="primary uppercase">Title</h5>
                                    <input type="text" id="title" required>
                                </label>
                                <label>
                                    <h5 class="primary uppercase">Slug</h5>
                                    <input type="text" id="slug" placeholder="e.g. how-ngss-builds-equity" required>
                                </label>

                                <label>
                                    <h5 class="primary uppercase">Tags</h5>
                                    <input type="text" id="tags" placeholder="e.g. NGSS, PLC, workshop" required>
                                </label>
                            </div>
                            <div id="blog_form_content">
                                <div id="primary_content_wrapper">
                                    <h5 class="primary uppercase">Content</h5>
                                    <input id="content" type="hidden" name="content">
                                    <trix-editor input="content"></trix-editor>
                                </div>
                                <div id="image_upload_wrapper">
                                    <label for="image" class="custom-file-upload primary-button">
                                        Upload Cover Image
                                        <input type="file" id="image" accept="image/*">
                                    </label>

                                    <div id="image_drop_area" class="upload-drop-area">
                                        <p>...or drag an image here</p>
                                        <img id="image_preview" class="image-preview" style="display: none;" />
                                        <button id="remove_cover_button" type="button" class="primary-button" style="display:none; margin-top:0.5em;">
                                            Remove Cover
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="button_wrapper">
                            <button type="button" class="primary-button close_button">Cancel</button>
                            <button id="post_button" type="submit" class="primary-button">Publish Post</button>
                        </div>
                    </form>

                    <p id="statusMsg" style="font-weight: bold;"></p>

                </div>
            </div>
        </div>

        <div id="newsletters_wrapper" style="display: none;">
            <section id="previous_newsletters_wrapper" class="">
                <div class="row">
                    <h2>Members</h2>
                </div>
                
                <div class="row">
                    <div id="contacts_wrapper">
                        <div id="contacts_table_wrapper" class="blob white">
                            <div class="">
                                <div class="header">
                                    <h4>Contacts</h4>
                                    <div id="contact_choice_wrapper">
                                        <div class="contact">Contacts <input id="contacts_check" type="checkbox" checked></div>
                                        <div class="newsletter">Newsletters <input id="newsletter_check" type="checkbox" checked></div>
                                        <div>
                                            <button id="copy_addresses_button" class="primary-button square_button copy_button"></button>
                                            <div id="email_copied_result" class="small_modal_wrapper">
                                                <div class="small_modal"></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="contact_list_row header_row">  
                                    <div>Name</div>
                                    <div>Email</div>
                                    <div></div>
                                </div>
                            </div>
                            <div class="contacts_list_wrapper">
                            </div>
                        </div>
                        
                    </div>
                    <div id="previous_newsletters"></div>
                    <div class="bottom_right_button_wrapper">
                        <button id="upload_newsletter_button" class="primary-button square_button upload_button"></button>
                    </div>
                </div>
            </section>
        </div>


        <div id="modal_messages" class="modal hidden">
            <div class="message_wrapper">
                <div class="messages_heading">Messages</div>
                <div class="messages_content">
                    <p class="primary uppercase">No messages yet.</p>
                </div>
                <div class="button_wrapper">
                    <button class="primary-button close_button">Close</button>
                </div>
            </div>
        </div>

        <script src="https://unpkg.com/trix@2.0.0/dist/trix.umd.min.js"></script>
        <script type="module" src="js/firebaseSetup.js?v=100" data-version></script>
        <!--<script type="module" src="js/main.js?v=100" data-version></script>-->
        <script type="module" src="js/admin.js?v=101" data-version></script>
        <script src="js/fixes.js?v=100" data-version></script>
        <script src="js/version.js"></script>
    </body>
</html>
